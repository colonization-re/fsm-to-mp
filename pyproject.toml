[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsm-to-mp"
dynamic = ["version"]
description = "Convert FreeCol .fsm maps to Sid Meier's Colonization .MP maps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Derevjanik" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fsm-to-mp = "fsm_to_mp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/fsm_to_mp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fsm_to_mp"]
